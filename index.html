<script>
'use strict';
const initialClaims=[{id:'BX-1028',name:'陈晓',dept:'运营部',type:'差旅交通',cents:36800,state:'待复核'},{id:'BX-1029',name:'林予',dept:'运营部',type:'办公采购',cents:128000,state:'待复核'},{id:'BX-1030',name:'周宁',dept:'产品部',type:'差旅住宿',cents:86000,state:'待复核'},{id:'BX-1031',name:'许川',dept:'运营部',type:'客户接待',cents:240000,state:'待复核'}];
const defaults=()=>({role:'employee',draft:0,live:1,versions:[1],harnessBuilds:0,runtimeRuns:0,claims:initialClaims.map(x=>({...x})),logs:[],messages:[],history:[],filter:'all'});
let storageOK=true,state;try{state=JSON.parse(localStorage.getItem('workbase-v1')||'null')||defaults();if(!Array.isArray(state.claims)||!Array.isArray(state.logs)||!Array.isArray(state.versions))state=defaults();}catch{storageOK=false;state=defaults();}let page='home',selected=new Set(),search='',statusFilter='all',routeType='extract',routeSensitivity='internal',routePriority='balanced',toastTimer,lastFocus;
const $=s=>document.querySelector(s), money=c=>'¥'+(c/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('workbase-v1',JSON.stringify(state));}catch{storageOK=false;}}
function log(action,detail){state.logs.unshift({time:new Date().toISOString(),role:state.role,action,detail,mode:'local-demo'});state.logs=state.logs.slice(0,100);save();}

function go(p){page=p;selected.clear();render();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent={home:'我的办公台',runtime:'应用运行',review:'构建与发布',routing:'模型路由',audit:'安全与审计'}[p];}
function stats(){return `<div class="stats"><div class="stat"><div class="label">已发布应用</div><div class="value">1 <span class="tiny muted">个</span></div><div class="detail">当前版本 v${state.live} · 版本已固定</div></div><div class="stat"><div class="label">本机应用运行</div><div class="value">${state.runtimeRuns} <span class="tiny muted">次</span></div><div class="detail">模型网络调用始终为 0</div></div><div class="stat"><div class="label">构建流程演示</div><div class="value">${state.harnessBuilds} <span class="tiny muted">次</span></div><div class="detail">规则模拟，未接入真实模型</div></div></div>`;}
function home(){return head('YOUR EVERYDAY WORK, SIMPLIFIED','把一次对话，变成每天能用的工具。','先和 Harness 说明任务，再把重复工作留给办公台。',pill('<i class="dot"></i> 企业策略已应用'))+stats()+`<div class="grid"><section class="card"><div class="cardhead"><div class="row"><span class="assistantavatar">W</span><h2>和 Harness 一起构建</h2></div>${pill('构建模式','blue')}</div><div class="chat" id="chat"><div class="message"><span class="assistantavatar">W</span><div class="bubble">下午好。今天有哪些反复做的工作？<br>我可以把表格核对、汇总和审批入口，整理成一个可复用的小应用。<div class="steps">${pill('受控组件','gray')}${pill('最小权限','gray')}${pill('发布前审核','gray')}</div></div></div>${state.messages.map(m=>`<div class="message ${m.who==='user'?'user':''}"><span class="${m.who==='user'?'avatar':'assistantavatar'}">${m.who==='user'?'J':'W'}</span><div class="bubble">${esc(m.text)}</div></div>`).join('')}</div><div class="chips"><button data-prompt="报销">报销核对与复核队列</button><button data-prompt="权限">查看应用权限边界</button><button data-prompt="迭代">为报销台增加部门筛选</button></div><div class="composer"><div class="composerbox"><label class="hidden" for="prompt">说明要构建的任务</label><textarea id="prompt" placeholder="例如：把每周报销核对做成一个办公台，可筛选、汇总并提交复核。"></textarea><div class="composerfoot"><span>● JSON Schema 输出 · 受控动作<br>预置场景模拟，不上传输入</span><button class="primary small" id="generate">生成草稿 ↗</button></div></div></div></section><section><div class="card"><div class="cardhead"><h2>我的常用应用</h2><span class="tiny muted">团队已审核</span></div><div class="tool"><div class="row"><div class="iconbox">▤</div><div><div class="tooltitle">费用报销核对台</div><span class="tiny muted">财务协作 / v${state.live}</span></div></div><p>筛选报销记录，计算合计，将异常项转交复核。</p><div class="toolmeta">${pill('打开不调用 AI')}<button class="small primary" data-go="runtime">打开应用 →</button></div></div><div class="tool"><div class="between"><h3 style="margin:0">工具从哪里来？</h3>${pill('4 个步骤','gray')}</div><div class="timeline"><div class="timeitem"><b>说明你的工作</b><br><span class="muted">明确输入、输出、权限与验收标准</span></div><div class="timeitem"><b>生成并验证草稿</b><br><span class="muted">Schema、数据绑定和动作都经过检查</span></div><div class="timeitem"><b>业务发布人审核</b><br><span class="muted">查看差异与权限，发布不可变版本</span></div><div class="timeitem"><b>下次直接打开</b><br><span class="muted">固定程序执行，模型不可用也能工作</span></div></div></div></div><div class="inlinebanner">✓ 本原型支持离线操作。所有记录均为合成数据；角色切换和审批仅作交互演示。</div></section></div>`;}
function visibleClaims(){return state.claims.filter(r=>(statusFilter==='all'||r.state===statusFilter)&&(!search||[r.id,r.name,r.dept,r.type].some(x=>x.includes(search)))&&(state.live<2||state.filter==='all'||r.dept===state.filter));}
function runtime(){const rows=visibleClaims(),cents=rows.reduce((s,r)=>s+r.cents,0);return head('APPLICATION / FINANCE','费用报销核对台','已发布版本 v'+state.live+' · 使用固定业务逻辑运行，不经过 Harness。',`<button class="small" id="iterate">让 AI 提议改版</button>${pill('<i class="dot"></i> 模型调用 0 次')}`)+`<div class="notice">运行路径：页面 → 固定规则 → 合成数据。正式系统中为：页面 → 业务 API → 服务端权限校验。本地角色模拟不能代替真实鉴权。</div><div class="twocol"><section class="card"><div class="toolbar"><div class="row"><input id="search" aria-label="搜索报销记录" placeholder="搜索编号、姓名或类型" value="${esc(search)}"><select id="statusFilter" aria-label="筛选状态"><option value="all">全部状态</option><option>待复核</option><option>已提交复核</option></select>${state.live>=2?`<select id="deptFilter" aria-label="筛选部门"><option value="all">全部部门</option><option>运营部</option><option>产品部</option></select>`:''}</div><button class="small" id="exportCsv">导出当前结果</button></div><div class="tablewrap"><table><thead><tr><th><input type="checkbox" id="selectAll" aria-label="选择当前所有待复核记录"></th><th>报销记录</th><th>申请人 / 部门</th><th>金额</th><th>状态</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><input type="checkbox" class="claimcheck" data-id="${r.id}" ${selected.has(r.id)?'checked':''} ${r.state!=='待复核'?'disabled':''} aria-label="选择${r.id}"></td><td><b>${r.id}</b><br><span class="tiny muted">${r.type}</span></td><td>${r.name}<br><span class="tiny muted">${r.dept}</span></td><td class="amount">${money(r.cents)}</td><td>${pill(r.state,r.state==='待复核'?'amber':'blue')}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">没有符合条件的记录</td></tr>'}</tbody></table></div><div class="appfooter"><span>当前 ${rows.length} 条 / 合计 <b>${money(cents)}</b></span><div class="row"><span id="selectionText">已选 ${selected.size} 条</span><button class="primary small" id="submitClaims" ${selected.size?'':'disabled'}>提交复核</button></div></div></section><aside><div class="card"><div class="cardhead"><h2>这次运行</h2>${pill('确定性执行')}</div><div class="cardbody"><div class="detailitem"><span>运行器</span><b>固定规则 v${state.live}</b></div><div class="detailitem"><span>模型网络调用</span><b>0 次</b></div><div class="detailitem"><span>金额计算</span><b>整数分合计</b></div><div class="detailitem"><span>外部付款</span><b>不支持</b></div><div class="detailitem"><span>权限范围</span><b>演示合成记录</b></div><div class="bottomnote">提交复核只改变本机演示状态，不代表审批通过或付款成功。</div></div></div><div class="card sectiongap"><div class="cardbody"><h3>已验证业务规则</h3><ul class="checks"><li>仅允许待复核记录提交</li><li>重复点击不会重复处理</li><li>表格输入按文本安全导出</li><li>改版通过审核后才可见</li></ul></div></div></aside></div>`;}
function review(){let v=state.draft;return head('BUILD / GOVERN / RELEASE','每一次改动，都有边界。','模型提议改动，规则检查，业务发布人决定是否上线。',`<button class="small" id="newDraft">生成${state.live+1}版草稿</button>`)+`<div class="twocol"><section><div class="card"><div class="cardhead"><div class="row"><h2>费用报销核对台</h2>${v?pill('v'+v+' 待发布','amber'):pill('无待发布草稿','gray')}</div>${pill('已发布 v'+state.live,'blue')}</div><div class="cardbody"><h3>${v?'本次变更说明':'当前已发布版本'}</h3><p class="compact muted">${v?(v>=2?'新增部门筛选；不扩大数据权限，不增加外部写入动作。':'将预置报销核对场景整理为可复用页面，沿用现有业务接口。'):'可以先回办公台生成草稿，再在这里查看差异并审核。'}</p><div class="pills">${pill('Schema 白名单')}${pill('固定业务动作')}${pill('无任意脚本')}${pill('权限未扩大')}</div><div class="sectiongap"><div class="detailitem"><span>允许操作</span><b>claims.list / claims.submit_review</b></div><div class="detailitem"><span>不可操作</span><b>付款、改权限、访问外部域名</b></div><div class="detailitem"><span>版本生效</span><b>仅新打开 / 新建任务使用新版本</b></div></div><h3 class="sectiongap">生成产物（受约束 DSL 摘要）</h3><pre class="code">${esc(JSON.stringify({app:'expense-review',version:v||state.live,renderer:'allowlisted-components',layout:['FilterBar','DataTable','SummaryCard','SubmitReview'],...( (v||state.live)>=2?{filters:['status','department']}:{}),actions:['claims.list','claims.submit_review'],permissions:{scope:'current-department',externalNetwork:false},runtime:{invokeHarness:false,eval:false}},null,2))}</pre><div class="between sectiongap"><span class="tiny muted">草稿不直接进入生产；权限变更需单独审批。</span><button class="primary small" id="publish" ${v?'':'disabled'}>审核并发布</button></div></div></div></section><aside><div class="card"><div class="cardhead"><h2>版本记录</h2><span class="tiny muted">本机演示</span></div><div class="cardbody">${[...state.versions].reverse().map(n=>`<div class="version ${n===state.live?'active':''}"><div class="between"><b>版本 v${n}</b>${n===state.live?pill('使用中','blue'):`<button class="small" data-rollback="${n}">回滚到此版本</button>`}</div><span class="tiny muted">${n>=2?'含部门筛选':'基础报销核对'} · 不可变产物</span></div>`).join('')}<p class="tiny muted">回滚切换应用版本，不撤销已经发生的业务动作。正式系统另设数据补偿方案。</p></div></div><div class="notice sectiongap">发布需切换为“业务发布人”。安全管理员可管理策略，但不能代替业务审批。</div></aside></div>`;}
function routeDecision(){if(routeType==='rule')return{model:'确定性程序',badge:'不调用模型',why:'合计、筛选与已发布表单不需要语言模型。保持计算可重复，也避免 Token 成本。',path:['能力检查 → 固定规则可完成','执行 → 已发布版本运行器','结果 → 规则校验']};if(routeSensitivity==='secret')return{model:'本地 Qwen',badge:'禁止云端外发',why:'数据密级先于成本与速度。仅内网推理；本地不可用则终止，不跨界回退。',path:['密级检查 → 机密','候选集 → 仅内网端点','服务不可用 → 阻断并交接']};if(routeType==='complex')return{model:'GPT-6 Astra',badge:'复杂任务候选',why:'复杂规划优先进入强模型候选。预算不足时暂停或交接，不悄悄降低质量门槛。',path:['密级 → 允许的企业云端候选','复杂度 → 高','验证失败 → 一次受限重试 / 人工']};if(routeType==='build')return{model:'GPT-6.1 Sol',badge:'开发任务候选',why:'面向页面 DSL 和代码草稿，平衡开发质量与成本；验证失败时在同一许可集合内升级。',path:['密级 → 允许的企业云端候选','任务 → 受约束页面构建','校验 → Schema + 测试门禁']};return{model:routePriority==='quality'?'GPT-6.1 Sol':'GPT-6 Luna',badge:'结构化抽取候选',why:'先用低成本候选；关键字段、引用、Schema 校验失败时升级。型号只是待业务评测的候选。',path:['密级 → 允许的企业云端候选','任务 → 结构化抽取','验证 → 字段与证据核验']};}
function routing(){let d=routeDecision();return head('MODEL ROUTER / POLICY FIRST','把合适的任务，交给合适的模型。','先限制可用候选，再比较质量、延迟与完整任务成本。',pill('规则推演 · 无模型请求','amber'))+`<div class="routegrid"><section class="card"><div class="cardhead"><h2>试一次路由决策</h2></div><div class="cardbody"><div class="field"><label for="routeType">任务类型</label><select id="routeType"><option value="extract">字段抽取 / 简短分类</option><option value="build">生成页面 DSL / 开发草稿</option><option value="complex">复杂分析 / 多步骤规划</option><option value="rule">筛选 / 计算 / 已发布应用</option></select></div><div class="field"><label for="sensitivity">数据密级</label><select id="sensitivity"><option value="internal">内部可脱敏 · 允许企业云端</option><option value="public">公开数据</option><option value="secret">机密 · 禁止外发</option></select></div><div class="field"><label for="priority">优化偏好（不能覆盖安全约束）</label><select id="priority"><option value="balanced">质量达标后平衡成本与速度</option><option value="cost">质量达标后成本优先</option><option value="speed">质量达标后延迟优先</option><option value="quality">更高质量余量</option></select></div><div class="notice" style="margin-bottom:0">这不是性能排行榜。模型最终选择应由同一组企业任务的离线评测决定。</div></div></section><section class="card"><div class="cardbody"><div class="routehero"><span class="tiny">当前策略候选</span><h3>${d.model}</h3>${pill(d.badge,'blue')}<p>${d.why}</p></div><div class="routepath">${d.path.map((x,i)=>`<div class="step"><span>0${i+1} &nbsp; ${x}</span><span class="muted">✓</span></div>`).join('')}</div><p class="tiny muted">外部模型故障时，fallback 仍须满足相同数据区域、密级、工具与预算限制。</p></div></section></div><section class="card sectiongap"><div class="cardhead"><h2>路由效果：上线前要验证什么</h2>${pill('真实评测尚未执行','gray')}</div><div class="tablewrap"><table><thead><tr><th>策略</th><th>任务成功率</th><th>单次成功任务总成本</th><th>端到端 P95</th><th>安全约束</th></tr></thead><tbody><tr><td>全部使用强模型（基线）</td><td>待评测</td><td>含重试与工具费用</td><td>待评测</td><td>不允许越权外发</td></tr><tr><td>全部使用轻量模型（基线）</td><td>待评测</td><td>需包含人工返工</td><td>待评测</td><td>不允许越权外发</td></tr><tr><td>规则分层 + 验证后升级</td><td>按场景统计</td><td>与两组基线比较</td><td>含排队和升级</td><td>已测用例零越界为发布门禁</td></tr></tbody></table></div></section>`;}
function audit(){return head('SECURITY / AUDIT','让每个决定，都能找到依据。','记录构建、发布、运行与阻断。生产环境使用服务端追加式审计。',`<button class="small" id="downloadAudit">导出本机审计 JSON</button>`)+`<div class="stats"><div class="stat"><div class="label">本机演示事件</div><div class="value">${state.logs.length}</div><div class="detail">非防篡改日志</div></div><div class="stat"><div class="label">真实云端模型调用</div><div class="value">0</div><div class="detail">无 API Key / 无连接器</div></div><div class="stat"><div class="label">敏感数据处理</div><div class="value" style="font-size:22px">合成数据</div><div class="detail">不接触企业内部资料</div></div></div><div class="notice">正式系统：网关鉴权、字段脱敏、服务端授权、密级路由、受控出网和不可变审计。此原型只演示交互，不提供生产安全保障。${storageOK?'':' 当前浏览器禁用持久化，刷新后可能丢失本机状态。'}</div><section class="card"><div class="cardhead"><h2>最近执行轨迹</h2>${pill('最多保留 100 条本机记录','gray')}</div><div class="tablewrap"><table><thead><tr><th>时间（本机）</th><th>事件</th><th>角色</th><th>详情</th></tr></thead><tbody>${state.logs.length?state.logs.map(x=>`<tr><td>${esc(new Date(x.time).toLocaleString('zh-CN',{hour12:false}))}</td><td><b>${esc(x.action)}</b></td><td>${esc({employee:'普通员工',publisher:'业务发布人',security:'安全管理员'}[x.role]||x.role)}</td><td>${esc(x.detail)}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">尚无事件。可先生成草稿、提交复核，或试一次无权限发布。</td></tr>'}</tbody></table></div></section>`;}
function render(){const funcs={home,runtime,review,routing,audit};$('#content').innerHTML=funcs[page]();$('#role').value=state.role;$('#draftBadge').textContent=state.draft?'1':'0';bind();if(page==='runtime'){$('#statusFilter').value=statusFilter;if($('#deptFilter'))$('#deptFilter').value=state.filter;}if(page==='routing'){$('#routeType').value=routeType;$('#sensitivity').value=routeSensitivity;$('#priority').value=routePriority;}}
function draft(prompt){let text=prompt.trim();if(!text){toast('请先说明任务，或点击上方示例。');return;}if(/权限|边界/.test(text)&&!/迭代|增加|生成/.test(text)){state.messages.push({who:'user',text},{who:'assistant',text:'应用只允许读取合成报销记录、提交复核。不允许付款、修改授权、访问外部网络；真实权限必须由服务端执行。'});save();render();return;}if(!/报销|复核|部门|费用/.test(text)){state.messages.push({who:'user',text},{who:'assistant',text:'本原型只预置报销核对场景，未接入通用模型。请尝试“生成报销核对台”或“增加部门筛选”。'});save();render();return;}state.draft=Math.max(...state.versions)+1;state.harnessBuilds++;state.messages.push({who:'user',text},{who:'assistant',text:`已生成 v${state.draft} 草稿（预置规则模拟）：增加部门筛选，保留现有复核动作。权限没有扩大。请到“构建与发布”查看产物，由业务发布人审核后上线。`});log('生成草稿',`v${state.draft}；预置规则模拟；真实模型请求 0`);render();toast('草稿已生成，尚未发布。');}
function modal(title,body,confirm,onConfirm){lastFocus=document.activeElement;$('#modal').innerHTML=`<section class="modal"><h2 id="modalTitle">${title}</h2>${body}<div class="modalactions"><button id="cancelModal">取消</button><button class="primary" id="confirmModal">${confirm}</button></div></section>`;$('#modal').classList.remove('hidden');$('#cancelModal').onclick=closeModal;$('#confirmModal').onclick=()=>{closeModal();onConfirm();};$('#cancelModal').focus();}
function closeModal(){$('#modal').classList.add('hidden');if(lastFocus?.isConnected)lastFocus.focus();}
function download(name,content,type){const blob=new Blob([content],{type}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function safeCsv(v){let s=String(v);if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('#prompt').value={报销:'把报销核对做成一个可复用的办公台。',权限:'查看这个应用的权限边界。',迭代:'为报销核对台增加部门筛选。'}[b.dataset.prompt];$('#prompt').focus();});if($('#generate'))$('#generate').onclick=()=>draft($('#prompt').value);if($('#prompt'))$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))draft(e.target.value);};if($('#iterate'))$('#iterate').onclick=()=>{go('home');$('#prompt').value='为报销核对台增加部门筛选。';$('#prompt').focus();};if($('#newDraft'))$('#newDraft').onclick=()=>draft('为费用报销核对台增加部门筛选');if($('#publish'))$('#publish').onclick=()=>{if(state.role!=='publisher'){log('发布被阻断','当前角色无业务发布权限');toast('发布被阻断：请在右上角切换为“业务发布人”后审核。');return;}modal('审核并发布 v'+state.draft,`<p>本次发布：新增部门筛选，不扩大数据访问范围。</p><ul class="checks"><li>组件与动作白名单通过（演示）</li><li>权限未扩大，无外部网络</li><li>新打开的页面使用 v${state.draft}</li></ul><p>这是本机原型发布，不影响外部系统。</p>`,'确认发布',()=>{state.live=state.draft;if(!state.versions.includes(state.live))state.versions.push(state.live);state.draft=0;log('发布版本','v'+state.live+'；业务发布人确认');render();toast('版本已发布。打开应用可查看新增部门筛选。');});};document.querySelectorAll('[data-rollback]').forEach(b=>b.onclick=()=>{if(state.role!=='publisher'){log('回滚被阻断','无业务发布权限');toast('只有业务发布人可回滚版本。');return;}let v=Number(b.dataset.rollback);modal('回滚至 v'+v,'<p>仅切换新打开应用的版本。既有复核状态保留；业务数据不会逆向回滚。</p>','确认回滚',()=>{state.live=v;state.filter='all';log('回滚版本','应用切换至 v'+v+'；业务记录保留');render();toast('应用版本已回滚，业务记录保留。');});});if($('#search'))$('#search').onchange=e=>{search=e.target.value;selected.clear();render();};if($('#statusFilter'))$('#statusFilter').onchange=e=>{statusFilter=e.target.value;selected.clear();render();};if($('#deptFilter'))$('#deptFilter').onchange=e=>{state.filter=e.target.value;selected.clear();save();render();};document.querySelectorAll('.claimcheck').forEach(b=>b.onchange=()=>{b.checked?selected.add(b.dataset.id):selected.delete(b.dataset.id);$('#selectionText').textContent='已选 '+selected.size+' 条';$('#submitClaims').disabled=!selected.size;});if($('#selectAll'))$('#selectAll').onchange=e=>{visibleClaims().filter(r=>r.state==='待复核').forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));render();};if($('#submitClaims'))$('#submitClaims').onclick=()=>{if(!selected.size)return;const ids=[...selected];modal('提交 '+ids.length+' 条报销记录复核',`<p>将 ${esc(ids.join('、'))} 从“待复核”变为“已提交复核”。本操作不会审批通过或付款。</p>`,'确认提交',()=>{let count=0;state.claims.forEach(r=>{if(ids.includes(r.id)&&r.state==='待复核'){r.state='已提交复核';count++;}});state.runtimeRuns++;log('提交复核',count+' 条；固定程序执行；模型调用 0');selected.clear();render();toast('已提交 '+count+' 条，未产生模型调用。');});};if($('#exportCsv'))$('#exportCsv').onclick=()=>{const rows=visibleClaims();download('workbase-claims-demo.csv','\ufeff'+[['编号','申请人','部门','类型','金额','状态'],...rows.map(r=>[r.id,r.name,r.dept,r.type,(r.cents/100).toFixed(2),r.state])].map(a=>a.map(safeCsv).join(',')).join('\r\n'),'text/csv;charset=utf-8');log('导出合成记录',rows.length+' 条；本机 CSV');toast('已导出当前合成数据。');};if($('#downloadAudit'))$('#downloadAudit').onclick=()=>download('workbase-audit-demo.json',JSON.stringify({warning:'Local demo only; not tamper-proof or production audit',events:state.logs},null,2),'application/json');['routeType','sensitivity','priority'].forEach(id=>{if($('#'+id))$('#'+id).onchange=e=>{if(id==='routeType')routeType=e.target.value;if(id==='sensitivity')routeSensitivity=e.target.value;if(id==='priority')routePriority=e.target.value;log('路由规则推演',routeDecision().model+'；密级 '+routeSensitivity+'；无模型请求');render();};});}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#role').onchange=e=>{state.role=e.target.value;log('演示角色切换',state.role);render();toast('演示角色已切换。生产授权须在服务端实现。');};$('#resetBtn').onclick=()=>modal('重置本机演示','<p>清除本机版本、复核状态和演示事件，恢复合成样例。此操作不接触外部系统。</p>','确认重置',()=>{state=defaults();selected.clear();search='';statusFilter='all';save();go('home');toast('演示已重置。');});$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal();};document.addEventListener('keydown',e=>{if($('#modal').classList.contains('hidden'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...$('#modal').querySelectorAll('button')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});render();
</script></body></html>
